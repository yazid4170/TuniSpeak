[tool.poetry]
name = "tunispeak"
version = "0.1.0"
description = "Trilingual question answering assistant for student services"
authors = ["TuniSpeak Team <team@tunispeak.local>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.3.0"
langdetect = "^1.0.9"
regex = "^2024.9.11"
rank-bm25 = "^0.2.2"
sentence-transformers = "^2.7.0"
scikit-learn = "^1.5.2"
faiss-cpu = "^1.8.0"
numpy = "^1.26.4"
pandas = "^2.2.2"
typer = "^0.12.4"
pypdf = "^4.3.1"
python-docx = "^1.1.2"
beautifulsoup4 = "^4.12.3"
rapidfuzz = "^3.9.3"
tqdm = "^4.66.5"
orjson = "^3.10.6"
python-dotenv = "^1.0.1"
structlog = "^24.1.0"
openpyxl = "^3.1.5"
sentencepiece = "^0.2.1"
protobuf = "^6.33.0"
datasets = "^2.19.0"
evaluate = "^0.4.2"
accelerate = "^0.30.0"
httpx = "^0.27.2"
peft = "^0.13.0"
huggingface-hub = "^0.36.0"
faster-whisper = "^1.0.3"
gtts = "^2.5.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
ruff = "^0.5.7"
mypy = "^1.11.2"
pre-commit = "^3.8.0"
black = "^24.8.0"

[tool.poetry.scripts]
tunispeak-api = "app.main:run"
tunispeak-ingest = "scripts.ingest_documents:app"
tunispeak-index = "scripts.build_hybrid_index:app"
tunispeak-eval = "scripts.evaluate_qa:app"
tunispeak-train = "scripts.train_qa_model:app"
tunispeak-fetch-external = "scripts.download_external_datasets:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
